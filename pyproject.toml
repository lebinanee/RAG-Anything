[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-anything"
version = "0.1.0"
description = "A multimodal RAG system that can process and retrieve information from any type of document"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "RAG-Anything Contributors" },
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "multimodal",
    "llm",
    "document-processing",
    "vector-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "lightrag-hku>=1.3.0",
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "tenacity>=8.2.0",
    "pypdf2>=3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
ocr = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
]
audio = [
    "openai-whisper>=20231117",
    "librosa>=0.10.0",
]
video = [
    "opencv-python>=4.9.0",
    "moviepy>=1.0.3",
]
all = [
    "rag-anything[ocr,audio,video]",
]

[project.urls]
Homepage = "https://github.com/HKUDS/RAG-Anything"
Repository = "https://github.com/HKUDS/RAG-Anything"
Issues = "https://github.com/HKUDS/RAG-Anything/issues"
Documentation = "https://github.com/HKUDS/RAG-Anything#readme"

[project.scripts]
rag-anything = "raganything.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["raganything"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "N806", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["raganything"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Removed --cov flags so a plain `pytest` run doesn't require pytest-cov installed
# -p no:warnings added personally to reduce noise during local dev runs
# --tb=short gives more concise tracebacks which I find easier to scan quickly
# --durations=10 shows the 10 slowest tests, helpful for spotting bottlenecks
# --durations-min=0.5 filters out anything under 0.5s so the durations list stays meaningful
# --no-header removes the pytest header banner, keeps output clean
addopts = "-p no:warnings --tb=short --durations=10 --durations-min=0.5 --no-header"
